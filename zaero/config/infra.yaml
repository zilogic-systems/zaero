    device_present: False            # Indicates whether the PDU device is available
    serial_port: '/dev/ttyUSB0'      # Serial port used to communicate with the PDU
    controller: 2                    # PDU outlet number assigned to the controller
    extender1: 1                     # PDU outlet number assigned to extender1
    extender2: 3                     # PDU outlet number assigned to extender2
    extender3: 4                     # PDU outlet number assigned to extender3